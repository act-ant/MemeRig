name: Publish to npm

# Both event sources stay wired so a published GitHub Release and a raw
# `v*` tag push both fire a publish. The shared release-preflight script
# makes reruns idempotent: if a package version is already on npm it is
# skipped, so duplicate triggers do not produce duplicate publishes.
on:
  # Manual dispatch is the escape hatch when tag pushes do not start a run;
  # dispatch against the release tag ref so check-versions --require-tag works.
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing (OIDC) to npm: no long-lived NPM_TOKEN secret is
      # used. npm exchanges this token for a short-lived publish credential
      # and attaches provenance automatically. Prerequisite: each package
      # (memerig, memerig-core) must have a Trusted Publisher configured on
      # npmjs.com for this repo + workflow file `publish.yml`.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24 + npm 11 are required by npm trusted publishing (npm >= 11.5.1,
      # Node >= 22.14). No `registry-url` here: it would write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}` and there is no token any more. The
      # default registry is already https://registry.npmjs.org.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # pnpm 10's `pnpm publish` has no OIDC support; 12.x implements
      # trusted publishing itself. Keep in sync with packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version alignment (core, cli, git tag)
        run: node packages/cli/scripts/release-preflight.js check-versions --require-tag

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      # Build before test: integration tests spawn the real CLI via
      # bin/memerig.js, which imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Verify packed CLI pins core to exact version
        run: node packages/cli/scripts/release-preflight.js verify-packed-cli

      - name: Compute publish plan
        id: plan
        run: node packages/cli/scripts/release-preflight.js publish-plan --github

      # BOOTSTRAP ONLY (delete with the publish-step env blocks once trusted
      # publishing is live). Verifies the token up front so an invalid secret
      # fails here with a clear message instead of a 404 from the registry.
      - name: Verify npm credential
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
            https://registry.npmjs.org/-/whoami)
          echo "npm whoami status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::NPM_TOKEN is invalid or expired (whoami=$code). Generate a new token."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # pnpm reads credentials from .npmrc; setup-node no longer writes one for
      # us (no registry-url, since that would also inject a token line).
      - name: Configure npm auth for pnpm
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          echo "wrote $(wc -l < "$HOME/.npmrc") auth line(s) to ~/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish memerig-core
        if: steps.plan.outputs.core_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/core
        env:
          # BOOTSTRAP ONLY. npm cannot hold a trusted publisher for a package
          # that does not exist yet, so the very first release of each package
          # authenticates with a short-lived token. Delete this env block (and
          # the NPM_TOKEN secret) once both packages exist and their trusted
          # publishers are configured; OIDC takes over from then on.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Skip memerig-core (already on npm)
        if: steps.plan.outputs.core_publish != 'true'
        run: echo "memerig-core@${{ steps.plan.outputs.version }} already published; skipping."

      - name: Publish memerig
        if: steps.plan.outputs.cli_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/cli
        env:
          # BOOTSTRAP ONLY — see the memerig-core step above.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Skip memerig (already on npm)
        if: steps.plan.outputs.cli_publish != 'true'
        run: echo "memerig@${{ steps.plan.outputs.version }} already published; skipping."

      - name: Verify published packages on public npm
        run: node packages/cli/scripts/release-preflight.js verify-npm --package all
