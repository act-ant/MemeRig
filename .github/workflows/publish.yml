name: Publish to npm

# GitLab owns tag publishing (see .gitlab-ci.yml). This workflow stays as a
# manual escape hatch — dispatch it against the release tag ref, so
# `check-versions --require-tag` sees the tag.
#
# The automatic triggers were removed on purpose: once the GitHub repo is a
# mirror, a mirrored `v*` tag push would fire this job next to the GitLab
# publish pipeline, and both would race the first `pnpm publish` of the same
# version.
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Token mode: publishing authenticates with secrets.NPM_TOKEN. No
      # `id-token: write` on purpose — with no OIDC token available pnpm skips
      # its trusted-publishing attempt instead of failing an exchange against a
      # package that has no trusted publisher yet. See release-process.md
      # "Publishing credential" for the switch back to OIDC.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24 for pnpm 12. No `registry-url`: it would write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}` pointing at an env var that only some
      # steps define; the token line is written explicitly below instead.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # pnpm 10's `pnpm publish` has no OIDC support; 12.x implements
      # trusted publishing itself. Keep in sync with packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version alignment (core, cli, git tag)
        run: node packages/cli/scripts/release-preflight.js check-versions --require-tag

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      # Build before test: integration tests spawn the real CLI via
      # bin/memerig.js, which imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Verify packed CLI pins core to exact version
        run: node packages/cli/scripts/release-preflight.js verify-packed-cli

      - name: Compute publish plan
        id: plan
        run: node packages/cli/scripts/release-preflight.js publish-plan --github

      # Verifies the token up front so an invalid or expired secret fails here
      # with a clear message instead of a 404 from the registry publish call.
      - name: Verify npm credential
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
            https://registry.npmjs.org/-/whoami)
          echo "npm whoami status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::NPM_TOKEN is invalid or expired (whoami=$code). Generate a new token."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # pnpm reads credentials from .npmrc, and nothing else writes one now that
      # setup-node has no registry-url.
      - name: Configure npm auth for pnpm
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          echo "wrote $(wc -l < "$HOME/.npmrc") auth line(s) to ~/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish memerig-core
        if: steps.plan.outputs.core_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/core
        env:
          # Token mode. Provenance is NOT requested: sigstore attestations need
          # an OIDC identity, so with a token npm reports none anyway.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip memerig-core (already on npm)
        if: steps.plan.outputs.core_publish != 'true'
        run: echo "memerig-core@${{ steps.plan.outputs.version }} already published; skipping."

      - name: Publish memerig
        if: steps.plan.outputs.cli_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/cli
        env:
          # Token mode — see the memerig-core step above.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip memerig (already on npm)
        if: steps.plan.outputs.cli_publish != 'true'
        run: echo "memerig@${{ steps.plan.outputs.version }} already published; skipping."

      - name: Verify published packages on public npm
        run: node packages/cli/scripts/release-preflight.js verify-npm --package all
